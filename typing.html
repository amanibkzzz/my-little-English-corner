<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typing practice · Little English Corner</title>
<style>
  :root { --bg:#fff7f3; --card:#ffffff; --ink:#3b2f33; --soft:#c9b9bd; --accent:#d9798f; --ok:#3f8f6b; --bad:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Georgia, "Times New Roman", serif; padding:16px; }
  main { max-width:640px; margin:0 auto; }
  a { color:var(--accent); text-decoration:none; }
  h1 { font-size:26px; margin:12px 0 4px; }
  .card { background:var(--card); border-radius:16px; padding:18px; margin-top:14px; border:1px solid #f0dfe3; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; border:1px solid var(--accent); background:#fff; color:var(--accent); padding:8px 14px; border-radius:999px; cursor:pointer; }
  button.on { background:var(--accent); color:#fff; }
  .sentence { font-size:24px; line-height:1.6; letter-spacing:.5px; min-height:90px; cursor:text; word-break:break-word; }
  .sentence .done { color:var(--ink); }
  .sentence .todo { color:var(--soft); }
  .sentence .cur { border-left:2px solid var(--accent); margin-left:-1px; }
  .shake { animation: shake .25s; }
  @keyframes shake { 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  input.hear { width:100%; font:inherit; font-size:20px; padding:10px 12px; border:1px solid var(--soft); border-radius:12px; margin-top:10px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); text-decoration:underline; }
  .stats { display:flex; gap:24px; margin-top:14px; }
  .stats b { font-size:22px; display:block; }
  .msg { min-height:24px; margin-top:10px; color:#7a6a6f; }
  #hidden { position:absolute; opacity:0; width:1px; height:1px; }
</style>
</head>
<body>
<main>
  <a href="index.html">← Home</a>
  <h1>Typing practice</h1>

  <div class="row" role="group" aria-label="Typing mode">
    <button id="modeSee" class="on">Type what you see</button>
    <button id="modeHear">Type what you hear</button>
  </div>

  <div class="card">
    <div id="counter">Sentence 1 / 1</div>

    <div id="seeBox">
      <p class="msg">Tap the sentence, then type it. Correct letters turn darker.</p>
      <div id="sentence" class="sentence" tabindex="0"></div>
      <input id="hidden" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the sentence here">
    </div>

    <div id="hearBox" hidden>
      <div class="row">
        <button id="play">Listen</button>
        <button id="slow">Slow: off</button>
      </div>
      <input id="hearInput" class="hear" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type what you hear" aria-label="Type what you hear">
      <div class="row" style="margin-top:10px"><button id="check">Check</button></div>
      <div id="hearResult" class="sentence" style="min-height:0;font-size:20px;margin-top:10px"></div>
    </div>

    <div id="msg" class="msg"></div>
    <div class="row" style="margin-top:10px">
      <button id="restart">Start over</button>
      <button id="next">Next sentence</button>
    </div>

    <div class="stats">
      <div><b id="letters">0</b>letters traced</div>
      <div><b id="finished">0 / 0</b>sentences finished</div>
    </div>
  </div>
</main>

<script>
// Edit this list. Each item is one sentence from your own script.
const SENTENCES = [
  "I can't believe you did that.",
  "Let's meet at the station tomorrow.",
  "She has been working here for years.",
  "Could you say that again, please?",
  "It was a long day, but a good one."
];

let mode = "see", index = 0, pos = 0, letters = 0, slow = false;
const finishedSet = new Set();

const $ = id => document.getElementById(id);
const sentenceEl = $("sentence"), hidden = $("hidden"), msg = $("msg");

function target() { return SENTENCES[index]; }

function updateCounter() {
  $("counter").textContent = "Sentence " + (index + 1) + " / " + SENTENCES.length;
  $("finished").textContent = finishedSet.size + " / " + SENTENCES.length;
  $("letters").textContent = letters;
}

function renderSee() {
  const t = target();
  const done = t.slice(0, pos), rest = t.slice(pos);
  sentenceEl.innerHTML = "";
  const a = document.createElement("span"); a.className = "done"; a.textContent = done;
  const c = document.createElement("span"); c.className = "cur";
  const b = document.createElement("span"); b.className = "todo"; b.textContent = rest;
  sentenceEl.append(a, c, b);
}

function load() {
  pos = 0;
  msg.textContent = "";
  $("hearInput").value = "";
  $("hearResult").textContent = "";
  renderSee();
  updateCounter();
}

function typeChar(ch) {
  const t = target();
  if (pos >= t.length) return;
  if (ch.toLowerCase() === t[pos].toLowerCase()) {
    pos++; letters++;
    while (pos < t.length && t[pos] === " ") pos++;
    renderSee();
    if (pos >= t.length) {
      finishedSet.add(index);
      msg.textContent = "Well done.";
    }
    updateCounter();
  } else {
    sentenceEl.classList.remove("shake");
    void sentenceEl.offsetWidth;
    sentenceEl.classList.add("shake");
  }
}

hidden.addEventListener("input", () => {
  for (const ch of hidden.value) typeChar(ch);
  hidden.value = "";
});
sentenceEl.addEventListener("click", () => hidden.focus());

function norm(w) { return w.toLowerCase().replace(/[^a-z0-9']/g, ""); }

$("check").addEventListener("click", () => {
  const want = target().split(/\s+/);
  const got = $("hearInput").value.trim().split(/\s+/);
  const out = $("hearResult"); out.innerHTML = "";
  let all = got.length === want.length;
  want.forEach((w, i) => {
    const s = document.createElement("span");
    const good = got[i] !== undefined && norm(got[i]) === norm(w);
    if (!good) all = false;
    s.className = good ? "ok" : "bad";
    s.textContent = w + " ";
    out.appendChild(s);
  });
  if (all) { finishedSet.add(index); msg.textContent = "Well done."; }
  else msg.textContent = "Red words need another try. Listen again.";
  updateCounter();
});

function speak() {
  if (!("speechSynthesis" in window)) { msg.textContent = "Your browser can't read the sentence aloud."; return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(target());
  u.lang = "en-US"; u.rate = slow ? 0.6 : 0.9;
  speechSynthesis.speak(u);
}
$("play").addEventListener("click", speak);
$("slow").addEventListener("click", () => {
  slow = !slow;
  $("slow").textContent = "Slow: " + (slow ? "on" : "off");
});

function setMode(m) {
  mode = m;
  $("modeSee").classList.toggle("on", m === "see");
  $("modeHear").classList.toggle("on", m === "hear");
  $("seeBox").hidden = m !== "see";
  $("hearBox").hidden = m !== "hear";
  load();
}
$("modeSee").addEventListener("click", () => setMode("see"));
$("modeHear").addEventListener("click", () => setMode("hear"));

$("restart").addEventListener("click", load);
$("next").addEventListener("click", () => {
  index = (index + 1) % SENTENCES.length;
  load();
});

load();
</script>
</body>
</html>
