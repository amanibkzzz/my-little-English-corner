<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing practice · Little English Corner</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;color:#594b60;background:radial-gradient(circle at 90% 5%,#f0eaff,transparent 25%),radial-gradient(circle at 5% 85%,#fde9f3,transparent 25%),#fff9fc}main{max-width:740px;margin:auto;padding:24px 16px 44px}.home{display:inline-block;text-decoration:none;color:#ad6e92;background:#fff;border:1px solid #f1deea;border-radius:99px;padding:9px 13px;font-weight:650}.head{text-align:center;padding:26px 10px 22px}.cat{font-size:2.8rem}h1{font-size:clamp(1.8rem,6vw,2.6rem);color:#785a78;margin:10px 0 7px}.head p{color:#987e96;line-height:1.6;margin:0}.box{background:#fff;border:1px solid #f0deeb;border-radius:24px;padding:clamp(18px,4vw,28px);box-shadow:0 12px 35px #76546d0a}.row{display:flex;justify-content:space-between;gap:12px}.label{color:#b9799c;font-size:.9rem;font-weight:700}.progress{height:7px;background:#f5eaf2;border-radius:99px;overflow:hidden;margin:13px 0 24px}.progress div{height:100%;background:#d78db1;width:0;transition:width .2s}.sentence{background:#fff5fa;border:1px solid #f3e0ed;border-radius:17px;padding:20px;font-size:clamp(1.15rem,4vw,1.55rem);line-height:1.6;color:#73586e;margin:12px 0 18px}.textarea{width:100%;min-height:110px;resize:vertical;border:1.5px solid #e8d6e5;border-radius:15px;padding:15px;font:inherit;font-size:1.05rem;outline:none;color:#57485d}.textarea:focus{border-color:#d18ab0;box-shadow:0 0 0 4px #f8eaf3}.btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}button{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:#c77da2;color:white}button.soft{background:#f5eaf4;color:#806480}button:disabled{opacity:.45;cursor:not-allowed}.feedback{min-height:50px;margin-top:16px;border-radius:14px;padding:13px;background:#faf4fb;color:#806d86;line-height:1.5}.feedback.good{background:#eef8f1;color:#47765a}.feedback.bad{background:#fff1f4;color:#a25670}.live{margin-top:12px;line-height:1.9;overflow-wrap:anywhere}.correct{color:#39865b;background:#eff8f1;border-radius:4px}.wrong{color:#b54f68;background:#fff0f2;border-radius:4px;text-decoration:underline}.stats{display:flex;gap:9px;margin-top:16px}.stat{flex:1;text-align:center;background:#fcf7fc;border:1px solid #f0e5f0;border-radius:13px;padding:11px}.stat strong{display:block;color:#806480;font-size:1.1rem}.stat span{color:#a18aa0;font-size:.78rem}.foot{text-align:center;color:#b49cb1;font-size:.88rem;margin:22px 0}@media(max-width:450px){.stat{padding:8px 3px}.stats{gap:5px}}
</style></head><body><main><a class="home" href="index.html">← Home</a><header class="head"><div class="cat">🐱</div><h1>Let's practice!</h1><p>Take your time. Mistakes are part of learning. ♡</p></header><section class="box"><div class="row"><span class="label" id="num">Exercise 1</span><span class="label" id="total">1 / 10</span></div><div class="progress"><div id="bar"></div></div><p style="color:#9a8198;margin:0">Type the sentence below:</p><div class="sentence" id="sentence"></div><textarea class="textarea" id="input" placeholder="Start typing here..." spellcheck="false" autocapitalize="off"></textarea><div class="btns"><button id="check">Check my answer</button><button class="soft" id="retry">Try again</button><button class="soft" id="next" disabled>Next sentence →</button></div><div class="feedback" id="feedback" role="status">Type the sentence, then check your answer.</div><div class="live" id="live"></div><div class="stats"><div class="stat"><strong id="words">0</strong><span>words typed</span></div><div class="stat"><strong id="accuracy">—</strong><span>accuracy</span></div><div class="stat"><strong id="done">0 / 10</strong><span>completed</span></div></div></section><div class="foot">Small steps still move you forward · ♡</div></main><script>
const list=["I enjoy learning new things.","She usually goes to school early.","My friends are waiting outside.","We watched a beautiful movie yesterday.","Learning a language takes time and practice.","Please remember to bring your notebook.","The weather is lovely this morning.","He speaks English with confidence.","I would like a cup of tea, please.","Every day is a new opportunity to learn."];let n=0,done=0,checked=false;const $=id=>document.getElementById(id);function normalize(s){return s.trim().replace(/\s+/g," ").toLowerCase()}function safe(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function render(){ $("sentence").textContent=list[n];$("num").textContent="Exercise "+(n+1);$("total").textContent=(n+1)+" / "+list.length;$("bar").style.width=(n/list.length*100)+"%";$("input").value="";$("live").innerHTML="";checked=false;$("feedback").className="feedback";$("feedback").textContent="Type the sentence, then check your answer.";$("next").disabled=true;$("words").textContent="0";$("accuracy").textContent="—";$("done").textContent=done+" / "+list.length} $("input").addEventListener("input",()=>{$("words").textContent=$("input").value.trim()? $("input").value.trim().split(/\s+/).length:0;if(checked){checked=false;$("live").innerHTML="";$("feedback").className="feedback";$("feedback").textContent="You've changed your answer. Check it again.";$("next").disabled=true}});$("check").onclick=()=>{const target=list[n],typed=$("input").value;if(!typed.trim()){$("feedback").className="feedback bad";$("feedback").textContent="Type something first, then check your answer.";return}const a=target.split(""),b=typed.split(""),out=[];for(let i=0;i<a.length;i++){let x=b[i]||"";out.push(x===a[i]?'<span class="correct">'+(x===" "?"&nbsp;":safe(x))+'</span>':'<span class="wrong">'+(a[i]===" "?"&nbsp;":safe(a[i]))+'</span>')}$("live").innerHTML=out.join("")+(b.length>a.length?'<span class="wrong">'+safe(b.slice(a.length).join(""))+'</span>':"");let pct=Math.round(a.filter((x,i)=>b[i]===x).length/a.length*100);$("accuracy").textContent=pct+"%";checked=true;const exact=normalize(typed)===normalize(target);if(exact){$("feedback").className="feedback good";$("feedback").textContent="Perfect! You typed it correctly. 🌷"}else{$("feedback").className="feedback bad";$("feedback").textContent="Almost! Green letters are correct; pink letters show the expected letters. You can retry or move on."}done=Math.max(done,n+1);$("done").textContent=done+" / "+list.length;$("next").disabled=n===list.length-1};$("retry").onclick=()=>{$("input").value="";$("input").focus();$("live").innerHTML="";checked=false;$("feedback").className="feedback";$("feedback").textContent="Try typing the sentence again.";$("words").textContent="0";$("accuracy").textContent="—";$("next").disabled=true};$("next").onclick=()=>{if(n<list.length-1){n++;render();$("input").focus()}else{$("feedback").className="feedback good";$("feedback").textContent="You've finished this set. Well done! ♡";$("bar").style.width="100%";$("next").disabled=true}};render();
</script></body></html>
